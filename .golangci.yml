version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - errcheck
    - unused
    - ineffassign
    - staticcheck
    - govet
    - gosec
  settings:
    gosec:
      excludes:
        - G104  # Audit errors not checked (often too noisy)

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
